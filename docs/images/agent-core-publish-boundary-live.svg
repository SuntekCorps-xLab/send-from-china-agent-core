<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One-way publication boundary for Agent Core</title>
  <desc id="desc">User-owned JSON or JSONL and a local identifier key enter a file-only publisher. Positive field policy, opaque identifiers, and atomic validation produce the only artifact that reaches the Worker. Private identifiers, unknown fields, and the key remain outside the runtime, which has no source connection, outbound fetch, live sync, or commerce write.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f3e9"/>
      <stop offset=".58" stop-color="#edf1e9"/>
      <stop offset="1" stop-color="#f2dfcf"/>
    </linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#092c31"/>
      <stop offset="1" stop-color="#174244"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#123c3e"/>
      <stop offset="1" stop-color="#082c31"/>
    </linearGradient>
    <linearGradient id="snapshot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd4b6"/>
      <stop offset="1" stop-color="#f18449"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#123638" flood-opacity=".16"/>
    </filter>
    <filter id="small-shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#123638" flood-opacity=".13"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0l10 5-10 5z" fill="#577b74"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0l10 5-10 5z" fill="#e85d22"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.ink{fill:#0b3034}.muted{fill:#687a76}.white{fill:#fff}.orange{fill:#c94b17}.green{fill:#5e885b}.eyebrow{font-size:14px;font-weight:800;letter-spacing:2.3px}.small{font-size:14px;font-weight:650}.micro{font-size:12px;font-weight:700}.label{font-size:17px;font-weight:760}.strong{font-size:21px;font-weight:820}.headline{font-size:43px}
      .input-packet{transform-box:fill-box;transform-origin:center;animation:inputPacket 12s cubic-bezier(.4,0,.2,1) infinite}.key-packet{animation-delay:.55s}.stage{transform-box:fill-box;transform-origin:center;animation:stageOne 12s ease infinite}.stage-two{animation-name:stageTwo}.stage-three{animation-name:stageThree}.stage-check{transform-box:fill-box;transform-origin:center;animation:checkPop 12s ease infinite}.check-two{animation-name:checkPopTwo}.check-three{animation-name:checkPopThree}.flow-line{stroke-dasharray:8 10;animation:dash 1.4s linear infinite}.snapshot-packet{transform-box:fill-box;transform-origin:center;animation:snapshotTravel 12s cubic-bezier(.55,0,.18,1) infinite}.runtime-pulse{transform-box:fill-box;transform-origin:center;animation:runtimePulse 12s ease infinite}.status-dot{animation:statusDot 12s ease infinite}.blocked{transform-box:fill-box;transform-origin:center;animation:blocked 12s ease infinite}.barrier-x{transform-box:fill-box;transform-origin:center;animation:barrier 2.2s ease-in-out infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.8s ease-in-out infinite}
      @keyframes inputPacket{0%,8%{opacity:0;transform:translateX(-28px)}14%,25%{opacity:1;transform:translateX(0)}34%,100%{opacity:.28;transform:translateX(114px)}}
      @keyframes stageOne{0%,18%{opacity:.45;transform:scale(.985)}25%,100%{opacity:1;transform:scale(1)}}
      @keyframes stageTwo{0%,30%{opacity:.42;transform:scale(.985)}38%,100%{opacity:1;transform:scale(1)}}
      @keyframes stageThree{0%,42%{opacity:.42;transform:scale(.985)}50%,100%{opacity:1;transform:scale(1)}}
      @keyframes checkPop{0%,20%{opacity:0;transform:scale(.5)}27%,100%{opacity:1;transform:scale(1)}}
      @keyframes checkPopTwo{0%,33%{opacity:0;transform:scale(.5)}40%,100%{opacity:1;transform:scale(1)}}
      @keyframes checkPopThree{0%,45%{opacity:0;transform:scale(.5)}52%,100%{opacity:1;transform:scale(1)}}
      @keyframes snapshotTravel{0%,50%{opacity:0;transform:translateX(-82px) scale(.9)}58%,73%{opacity:1;transform:translateX(0) scale(1)}81%,100%{opacity:.18;transform:translateX(205px) scale(.88)}}
      @keyframes runtimePulse{0%,64%{opacity:.62;transform:scale(.985)}73%,93%{opacity:1;transform:scale(1)}100%{opacity:.62;transform:scale(.985)}}
      @keyframes statusDot{0%,65%{fill:#70817c}73%,93%{fill:#8fc080}100%{fill:#70817c}}
      @keyframes blocked{0%,22%{opacity:.35;transform:translateY(-6px)}38%,100%{opacity:1;transform:translateY(0)}}
      @keyframes barrier{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes dash{to{stroke-dashoffset:-36}}
      @keyframes spark{0%,100%{transform:scale(.84) rotate(0);opacity:.72}50%{transform:scale(1.12) rotate(12deg);opacity:1}}
      @media (prefers-reduced-motion:reduce){.input-packet,.stage,.stage-check,.flow-line,.snapshot-packet,.runtime-pulse,.status-dot,.blocked,.barrier-x,.spark{animation:none!important}.input-packet{opacity:.3;transform:translateX(114px)}.stage,.stage-check,.runtime-pulse,.blocked{opacity:1;transform:none}.snapshot-packet{opacity:1;transform:translateX(0) scale(1)}.status-dot{fill:#8fc080}}
    </style>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#background)"/>
  <circle cx="130" cy="92" r="190" fill="#efb58e" opacity=".43"/>
  <circle cx="1518" cy="810" r="220" fill="#c5d8c3" opacity=".58"/>

  <g filter="url(#shadow)">
    <rect x="46" y="43" width="1508" height="814" rx="34" fill="#fffdf9"/>
    <rect x="46" y="43" width="1508" height="78" rx="34" fill="url(#nav)"/>
    <path d="M46 87v34h1508V87" fill="url(#nav)"/>
  </g>

  <g class="sans">
    <circle cx="91" cy="82" r="22" fill="#fff"/>
    <path d="M91 64l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#e85d22" class="spark"/>
    <text x="127" y="89" class="label white">SEND FROM CHINA</text>
    <rect x="323" y="64" width="118" height="37" rx="18.5" fill="#2b5152"/>
    <circle cx="344" cy="82.5" r="6" fill="#8fc080"/>
    <text x="358" y="88" class="small white">Agent Core</text>
    <text x="1275" y="88" class="small white">Build-time trust boundary</text>

    <text x="82" y="165" class="eyebrow orange">ONE-WAY PUBLICATION</text>
    <text x="82" y="209" class="serif ink headline">Private input stays private. Only the snapshot ships.</text>
    <text x="82" y="239" class="small muted">The publisher runs locally; the Worker receives one validated, public artifact.</text>

    <!-- Source environment -->
    <rect x="82" y="281" width="344" height="398" rx="27" fill="#f6f2e9" stroke="#d5ddd7"/>
    <text x="110" y="319" class="eyebrow muted">SOURCE ENVIRONMENT</text>
    <text x="110" y="353" class="strong ink">User-owned inputs</text>

    <g filter="url(#small-shadow)">
      <rect x="110" y="382" width="288" height="99" rx="19" fill="#fff" stroke="#d5ddd7"/>
      <rect x="128" y="401" width="58" height="61" rx="12" fill="#e4ece5"/>
      <path d="M145 414h24l8 8v27h-32z" fill="none" stroke="#325a59" stroke-width="3" stroke-linejoin="round"/>
      <path d="M169 414v10h9" fill="none" stroke="#325a59" stroke-width="3"/>
      <text x="203" y="418" class="eyebrow green">CATALOG</text>
      <text x="203" y="444" class="label ink">JSON or JSONL</text>
      <text x="203" y="464" class="micro muted">selected local file</text>
    </g>

    <g filter="url(#small-shadow)">
      <rect x="110" y="500" width="288" height="99" rx="19" fill="#fff" stroke="#d5ddd7"/>
      <rect x="128" y="519" width="58" height="61" rx="12" fill="#f3e4d8"/>
      <circle cx="151" cy="543" r="10" fill="none" stroke="#c84f1e" stroke-width="4"/>
      <path d="M159 550l15 15m-5-5l-7 7" stroke="#c84f1e" stroke-width="4" stroke-linecap="round"/>
      <text x="203" y="536" class="eyebrow orange">LOCAL SECRET</text>
      <text x="203" y="562" class="label ink">Identifier key</text>
      <text x="203" y="582" class="micro muted">environment only</text>
    </g>

    <rect x="110" y="621" width="288" height="35" rx="17.5" fill="#e6ece5"/>
    <circle cx="131" cy="638.5" r="6" fill="#78a76d"/>
    <text x="146" y="644" class="small ink">No network client</text>

    <!-- Input packets moving only toward the local publisher -->
    <g class="input-packet">
      <circle cx="421" cy="431" r="10" fill="#739c6a"/>
      <path d="M434 431h43" stroke="#577b74" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    </g>
    <g class="input-packet key-packet">
      <circle cx="421" cy="549" r="10" fill="#e07c45"/>
      <path d="M434 549h43" stroke="#e07c45" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    </g>

    <!-- Local publisher -->
    <rect x="474" y="281" width="536" height="398" rx="27" fill="#eef2eb" stroke="#cdd9d0"/>
    <text x="503" y="319" class="eyebrow green">FILE-ONLY PUBLISHER</text>
    <text x="503" y="353" class="strong ink">Build a safe public artifact</text>

    <g class="stage" filter="url(#small-shadow)">
      <rect x="503" y="382" width="476" height="69" rx="18" fill="#fff" stroke="#d1dad3"/>
      <circle cx="538" cy="416.5" r="19" fill="#dfeae0"/>
      <path d="M529 417l6 6 12-15" fill="none" stroke="#5c8c58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="572" y="410" class="label ink">Positive field allowlist</text>
      <text x="572" y="432" class="micro muted">rebuilds every public product</text>
      <circle cx="945" cy="416.5" r="14" fill="#79a970" class="stage-check"/>
      <path d="M938 417l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/>
    </g>

    <g class="stage stage-two" filter="url(#small-shadow)">
      <rect x="503" y="466" width="476" height="69" rx="18" fill="#fff" stroke="#d1dad3"/>
      <circle cx="538" cy="500.5" r="19" fill="#f2e1d5"/>
      <path d="M527 501h22m-18-8h14m-10 16h6" stroke="#cb5722" stroke-width="3" stroke-linecap="round"/>
      <text x="572" y="494" class="label ink">Opaque public identifiers</text>
      <text x="572" y="516" class="micro muted">stable IDs without source references</text>
      <circle cx="945" cy="500.5" r="14" fill="#79a970" class="stage-check check-two"/>
      <path d="M938 501l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/>
    </g>

    <g class="stage stage-three" filter="url(#small-shadow)">
      <rect x="503" y="550" width="476" height="69" rx="18" fill="#fff" stroke="#d1dad3"/>
      <circle cx="538" cy="584.5" r="19" fill="#dfe8e6"/>
      <path d="M528 585h20m-10-10v20" stroke="#315b5b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="538" cy="585" r="13" fill="none" stroke="#315b5b" stroke-width="2"/>
      <text x="572" y="578" class="label ink">Atomic snapshot validation</text>
      <text x="572" y="600" class="micro muted">one invalid record rejects the build</text>
      <circle cx="945" cy="584.5" r="14" fill="#79a970" class="stage-check check-three"/>
      <path d="M938 585l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/>
    </g>

    <text x="503" y="650" class="micro muted">Local processing only</text>
    <path d="M640 646h312" stroke="#6f8e88" stroke-width="2.5" class="flow-line" marker-end="url(#arrow-green)"/>

    <!-- Publication boundary -->
    <rect x="1034" y="281" width="6" height="398" rx="3" fill="#e85d22" opacity=".86"/>
    <rect x="1002" y="302" width="70" height="30" rx="15" fill="#fff" stroke="#e4c8b8"/>
    <text x="1016" y="322" class="micro orange">GATE</text>

    <g class="snapshot-packet" filter="url(#small-shadow)">
      <rect x="973" y="391" width="175" height="132" rx="20" fill="url(#snapshot)"/>
      <path d="M1011 414h61l20 20v63h-81z" fill="#fff" opacity=".92"/>
      <path d="M1072 414v22h22" fill="none" stroke="#d56830" stroke-width="3"/>
      <path d="M1027 452h49m-49 13h49m-49 13h35" stroke="#d56830" stroke-width="3" stroke-linecap="round"/>
      <text x="993" y="548" class="micro ink">PUBLISHED SNAPSHOT</text>
    </g>

    <!-- Runtime -->
    <rect x="1086" y="281" width="430" height="398" rx="27" fill="url(#runtime)"/>
    <text x="1116" y="319" class="eyebrow" fill="#99c38e">WORKER RUNTIME</text>
    <text x="1116" y="353" class="strong white">Snapshot-only gateway</text>

    <g class="runtime-pulse" filter="url(#small-shadow)">
      <rect x="1116" y="382" width="370" height="144" rx="22" fill="#f7f7f1"/>
      <circle cx="1167" cy="433" r="30" fill="#173f40"/>
      <path d="M1167 410l6 17 17 6-17 6-6 17-6-17-17-6 17-6z" fill="#f28b50"/>
      <text x="1214" y="420" class="eyebrow green">AGENT CORE</text>
      <text x="1214" y="449" class="strong ink">Validated snapshot</text>
      <text x="1214" y="473" class="micro muted">loaded at startup</text>
      <circle cx="1221" cy="496" r="7" class="status-dot"/>
      <text x="1238" y="502" class="small ink">Read-only runtime ready</text>
    </g>

    <rect x="1116" y="546" width="370" height="105" rx="20" fill="#0a292d" stroke="#496c6d"/>
    <g transform="translate(1140 567)">
      <circle cx="8" cy="8" r="8" fill="#8fbd80"/>
      <path d="M4 8l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="27" y="13" class="small white">HTTP + MCP from one policy</text>
    </g>
    <g transform="translate(1140 606)">
      <circle cx="8" cy="8" r="8" fill="#8fbd80"/>
      <path d="M4 8l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="27" y="13" class="small white">No source connector at runtime</text>
    </g>

    <!-- Rejected/private material stays behind the publication gate -->
    <rect x="82" y="710" width="928" height="103" rx="24" fill="#f6eee7" stroke="#e6d2c3"/>
    <text x="110" y="743" class="eyebrow orange">DOES NOT CROSS THE GATE</text>
    <g class="blocked">
      <rect x="110" y="759" width="178" height="34" rx="17" fill="#fff"/>
      <circle cx="130" cy="776" r="7" fill="#df7650"/>
      <text x="145" y="781" class="small ink">identifier key</text>
      <rect x="304" y="759" width="158" height="34" rx="17" fill="#fff"/>
      <circle cx="324" cy="776" r="7" fill="#df7650"/>
      <text x="339" y="781" class="small ink">source_id</text>
      <rect x="478" y="759" width="193" height="34" rx="17" fill="#fff"/>
      <circle cx="498" cy="776" r="7" fill="#df7650"/>
      <text x="513" y="781" class="small ink">unknown fields</text>
      <rect x="687" y="759" width="288" height="34" rx="17" fill="#eaded5"/>
      <text x="711" y="781" class="small orange">kept local or discarded</text>
    </g>

    <!-- Explicitly disconnected runtime -->
    <rect x="1086" y="710" width="430" height="103" rx="24" fill="#eef1eb" stroke="#d0d9d1"/>
    <text x="1116" y="743" class="eyebrow muted">NO RUNTIME CONNECTION</text>
    <path d="M1118 774h57" stroke="#718681" stroke-width="3" stroke-dasharray="7 8"/>
    <g class="barrier-x">
      <circle cx="1195" cy="774" r="15" fill="#e85d22"/>
      <path d="M1189 768l12 12m0-12l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M1215 774h54" stroke="#718681" stroke-width="3" stroke-dasharray="7 8"/>
    <text x="1287" y="767" class="small ink">No outbound fetch</text>
    <text x="1287" y="790" class="micro muted">No live sync · No commerce write</text>
  </g>
</svg>
