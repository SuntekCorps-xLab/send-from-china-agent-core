<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Core guarded HTTP and MCP runtime</title>
  <desc id="desc">HTTP and MCP clients share anonymous discovery and a protected runtime path through authentication, tenant scope, a published snapshot, and a positive response policy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f3e9"/><stop offset=".55" stop-color="#edf1e9"/><stop offset="1" stop-color="#f0ddcd"/>
    </linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#092c31"/><stop offset="1" stop-color="#174244"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#123638" flood-opacity=".14"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#6c8985"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.ink{fill:#0b3034}.muted{fill:#687873}.white{fill:#fff}.orange{fill:#cf4d17}.eyebrow{font-size:13px;font-weight:800;letter-spacing:2px}.small{font-size:13px;font-weight:650}.label{font-size:17px;font-weight:800}.body{font-size:15px;font-weight:650}
      .flow{fill:none;stroke:#6c8985;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 10;animation:dash 1.25s linear infinite}.stage{transform-box:fill-box;transform-origin:center;animation:stage 10s ease-in-out infinite}.s2{animation-delay:1.1s}.s3{animation-delay:2.2s}.s4{animation-delay:3.3s}.response{transform-box:fill-box;transform-origin:center;animation:response 10s ease-in-out infinite}.r2{animation-delay:.45s}.packet{animation:packet 10s cubic-bezier(.4,0,.2,1) infinite}.discovery-dot{animation:discovery 5s ease-in-out infinite}.d2{animation-delay:2.5s}.shield{transform-box:fill-box;transform-origin:center;animation:shield 2.4s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-36}}@keyframes stage{0%,12%,88%,100%{transform:translateY(0);filter:none}25%,68%{transform:translateY(-4px);filter:url(#glow)}}@keyframes response{0%,55%{opacity:.55;transform:translateX(-8px)}70%,92%{opacity:1;transform:translateX(0)}100%{opacity:.55;transform:translateX(-8px)}}@keyframes packet{0%,12%{opacity:0;transform:translateX(0)}18%{opacity:1}74%{opacity:1;transform:translateX(840px)}82%,100%{opacity:0;transform:translateX(840px)}}@keyframes discovery{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(24px)}}@keyframes shield{0%,100%{transform:scale(.94)}50%{transform:scale(1.08)}}
      @media (prefers-reduced-motion:reduce){.flow,.stage,.response,.packet,.discovery-dot,.shield{animation:none!important}.stage,.response{opacity:1;transform:none}.packet{display:none}}
    </style>
  </defs>

  <rect width="1600" height="760" rx="40" fill="url(#bg)"/>
  <circle cx="142" cy="108" r="172" fill="#efbe9b" opacity=".36"/><circle cx="1482" cy="692" r="184" fill="#cbd8c4" opacity=".52"/>
  <g filter="url(#shadow)">
    <rect x="52" y="46" width="1496" height="668" rx="32" fill="#fffdf9"/>
    <rect x="52" y="46" width="1496" height="82" rx="32" fill="url(#nav)"/><path d="M52 92v36h1496V92" fill="url(#nav)"/>
  </g>

  <g class="sans">
    <circle cx="96" cy="87" r="22" fill="#fff"/><path d="M96 69l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#e85d22"/>
    <text x="132" y="94" class="label white">SEND FROM CHINA</text><rect x="316" y="69" width="124" height="36" rx="18" fill="#294f50"/><circle cx="338" cy="87" r="6" fill="#8fc080"/><text x="352" y="92" class="small white">Agent Core</text>
    <text x="1242" y="92" class="small white">Read-only runtime</text>
    <rect x="1380" y="68" width="64" height="38" rx="19" fill="#fff" opacity=".12"/><circle cx="1395" cy="87" r="5" fill="#8fc080"/><text x="1406" y="92" class="small white">HTTP</text>
    <rect x="1450" y="68" width="64" height="38" rx="19" fill="#fff" opacity=".12"/><circle cx="1465" cy="87" r="5" fill="#f08a4e"/><text x="1476" y="92" class="small white">MCP</text>

    <text x="86" y="171" class="eyebrow orange">ONE GUARDED RUNTIME · TWO PROTOCOLS</text>
    <text x="86" y="211" class="serif ink" font-size="37">Discover openly. Call with scope. Return public fields.</text>

    <rect x="86" y="238" width="1428" height="64" rx="20" fill="#edf1eb" stroke="#d3ddd5"/>
    <circle cx="116" cy="270" r="13" fill="#78a56e" class="discovery-dot"/><path d="M110 270h12M116 264v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="143" y="265" class="eyebrow" fill="#588053">ANONYMOUS DISCOVERY</text><text x="143" y="286" class="body ink">/.well-known · /health · MCP initialize · tools/list</text>
    <rect x="1165" y="253" width="322" height="34" rx="17" fill="#fff"/><circle cx="1186" cy="270" r="6" fill="#b8c0b9"/><text x="1200" y="275" class="small muted">No product or tenant data returned</text>

    <rect x="86" y="326" width="252" height="330" rx="24" fill="#f5f2ea" stroke="#d2dbd4"/>
    <text x="112" y="362" class="eyebrow orange">CLIENTS</text>
    <g filter="url(#shadow)"><rect x="112" y="386" width="200" height="92" rx="20" fill="#fff"/><circle cx="146" cy="432" r="22" fill="#e5eee8"/><path d="M134 420h24v22h-24zm5 27h14" fill="none" stroke="#285457" stroke-width="3" stroke-linecap="round"/><text x="178" y="427" class="label ink">HTTP app</text><text x="178" y="449" class="small muted">JSON request</text></g>
    <g filter="url(#shadow)"><rect x="112" y="514" width="200" height="92" rx="20" fill="#fff"/><circle cx="146" cy="560" r="22" fill="#f1e2d6"/><path d="M134 553l12-8 12 8v15l-12 8-12-8z" fill="none" stroke="#d65c25" stroke-width="3"/><circle cx="146" cy="560" r="4" fill="#d65c25"/><text x="178" y="555" class="label ink">MCP client</text><text x="178" y="577" class="small muted">tools/call</text></g>
    <rect x="105" y="622" width="214" height="22" rx="11" fill="#e7ece6"/><circle cx="120" cy="633" r="5" fill="#75a269"/><text x="132" y="638" class="small ink">Protected calls carry a key</text>

    <rect x="368" y="326" width="882" height="330" rx="24" fill="#10383b"/>
    <text x="396" y="362" class="eyebrow" fill="#9bcf91">SERVER-SIDE TRUST BOUNDARY</text>
    <path d="M338 432H396" class="flow" marker-end="url(#arrow)"/>
    <path d="M338 560H360C374 560 374 470 396 470" class="flow" marker-end="url(#arrow)"/>
    <path d="M592 470H625" class="flow" marker-end="url(#arrow)"/>
    <path d="M821 470H854" class="flow" marker-end="url(#arrow)"/>
    <path d="M1050 470H1083" class="flow" marker-end="url(#arrow)"/>

    <g class="stage"><rect x="396" y="400" width="196" height="140" rx="20" fill="#fffdf9"/><circle cx="432" cy="438" r="22" fill="#e6eee7" class="shield"/><path d="M432 423l13 6v10c0 10-7 16-13 19-6-3-13-9-13-19v-10z" fill="#75a269"/><path d="M426 439l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="464" y="434" class="label ink">Auth gate</text><text x="464" y="456" class="small muted">Bearer credential</text><path d="M419 488h150" stroke="#d9dfd9"/><text x="419" y="512" class="small ink">Deployment-held registry</text></g>
    <g class="stage s2"><rect x="625" y="400" width="196" height="140" rx="20" fill="#fffdf9"/><circle cx="661" cy="438" r="22" fill="#f0e2d7"/><path d="M651 437a10 10 0 1 1 20 0v6h5v13h-30v-13h5z" fill="#df6d36"/><circle cx="661" cy="449" r="2.5" fill="#fff"/><text x="693" y="434" class="label ink">Tenant scope</text><text x="693" y="456" class="small muted">Access + quota</text><path d="M648 488h150" stroke="#d9dfd9"/><text x="648" y="512" class="small ink">Fail closed · bounded</text></g>
    <g class="stage s3"><rect x="854" y="400" width="196" height="140" rx="20" fill="#fffdf9"/><circle cx="890" cy="438" r="22" fill="#e4ece5"/><path d="M879 425h22v27h-22z" fill="#31595b"/><path d="M883 431h14M883 437h14M883 443h9" stroke="#c4d5ca" stroke-width="2"/><text x="922" y="434" class="label ink">Snapshot</text><text x="922" y="456" class="small muted">Published file</text><path d="M877 488h150" stroke="#d9dfd9"/><text x="877" y="512" class="small ink">No live source lookup</text></g>
    <g class="stage s4"><rect x="1083" y="400" width="139" height="140" rx="20" fill="#fffdf9"/><circle cx="1118" cy="438" r="22" fill="#e6eee7"/><path d="M1107 438l7 7 14-17" fill="none" stroke="#6b9c63" stroke-width="5" stroke-linecap="round"/><text x="1083" y="578" class="small white" opacity="0">.</text><text x="1150" y="431" class="label ink">Public</text><text x="1150" y="453" class="label ink">fields</text><path d="M1106 488h93" stroke="#d9dfd9"/><text x="1106" y="510" class="small ink">Allowlist</text></g>
    <circle cx="401" cy="470" r="7" fill="#ff9959" filter="url(#glow)" class="packet"/>
    <rect x="396" y="578" width="826" height="50" rx="17" fill="#092d31" stroke="#416365"/><circle cx="421" cy="603" r="7" fill="#8fbd80"/><text x="440" y="598" class="eyebrow" fill="#9db8b2">FIXED RUNTIME BOUNDARY</text><text x="440" y="618" class="small white">No outbound fetch · no cart · no order · no payment</text>

    <rect x="1280" y="326" width="234" height="330" rx="24" fill="#edf1eb" stroke="#d2dbd4"/>
    <text x="1306" y="362" class="eyebrow orange">RETURNS</text>
    <path d="M1222 438H1280" class="flow" marker-end="url(#arrow)"/>
    <path d="M1222 502H1246C1264 502 1264 560 1280 560" class="flow" marker-end="url(#arrow)"/>
    <g class="response" filter="url(#shadow)"><rect x="1306" y="388" width="182" height="108" rx="19" fill="#fff"/><circle cx="1336" cy="424" r="19" fill="#e4ece5"/><path d="M1327 417h18v15h-18zm4 19h10" fill="none" stroke="#285457" stroke-width="2.5"/><text x="1362" y="421" class="label ink">HTTP JSON</text><text x="1362" y="444" class="small muted">Scoped result</text><rect x="1327" y="467" width="132" height="8" rx="4" fill="#8dae80"/></g>
    <g class="response r2" filter="url(#shadow)"><rect x="1306" y="516" width="182" height="108" rx="19" fill="#fff"/><circle cx="1336" cy="552" r="19" fill="#f0e2d7"/><path d="M1326 546l10-7 10 7v13l-10 7-10-7z" fill="none" stroke="#d65c25" stroke-width="2.5"/><text x="1362" y="549" class="label ink">MCP result</text><text x="1362" y="572" class="small muted">Same policy</text><rect x="1327" y="595" width="132" height="8" rx="4" fill="#e08a59"/></g>

    <rect x="86" y="675" width="1428" height="24" rx="12" fill="#f0eee8"/><circle cx="106" cy="687" r="6" fill="#75a269"/><text x="121" y="692" class="small ink">Discovery is anonymous; product and tool calls are authenticated · one snapshot · one tenant policy · two protocols</text>
  </g>
</svg>
