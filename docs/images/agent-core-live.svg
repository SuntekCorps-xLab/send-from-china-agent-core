<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Interactive Agent Core catalog and sourcing walkthrough</title>
  <desc id="desc">The interface switches from governed catalog search to an explicitly confirmed illustrative dynamic sourcing preview.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f3e9"/><stop offset=".55" stop-color="#edf1e9"/><stop offset="1" stop-color="#f2dfcf"/>
    </linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#092c31"/><stop offset="1" stop-color="#174244"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9f5b"/><stop offset="1" stop-color="#e55319"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#123638" flood-opacity=".17"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.ink{fill:#0b3034}.muted{fill:#6a7975}.white{fill:#fff}.orange{fill:#cf4d17}.green{fill:#598257}.eyebrow{font-size:13px;font-weight:800;letter-spacing:2px}.small{font-size:13px;font-weight:600}.label{font-size:16px;font-weight:750}.strong{font-size:19px;font-weight:800}
      .search-page{animation:searchPage 14s cubic-bezier(.65,0,.2,1) infinite}.source-page{animation:sourcePage 14s cubic-bezier(.65,0,.2,1) infinite}.search-active{animation:searchActive 14s ease infinite}.source-active{animation:sourceActive 14s ease infinite}.tab-marker{animation:tabMarker 14s cubic-bezier(.65,0,.2,1) infinite}
      .typed{animation:typed 14s steps(32,end) infinite}.caret{animation:caret .8s step-end infinite}.result-card{transform-box:fill-box;transform-origin:center;animation:resultCard 14s cubic-bezier(.2,.8,.2,1) infinite;animation-fill-mode:both}.r2{animation-delay:.18s}.r3{animation-delay:.36s}.trace{animation:trace 14s ease infinite;animation-fill-mode:both}.t2{animation-delay:.28s}.t3{animation-delay:.56s}
      .pointer{transform-box:fill-box;animation:pointer 14s cubic-bezier(.4,0,.2,1) infinite}.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}.step{animation:step1 14s ease infinite}.s2{animation-name:step2}.s3{animation-name:step3}.s4{animation-name:step4}.dash{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}.candidate{transform-box:fill-box;transform-origin:center;animation:candidate 14s cubic-bezier(.2,.8,.2,1) infinite}.ca2{animation-delay:.22s}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.6s ease-in-out infinite}
      @keyframes searchPage{0%,39%{opacity:1;transform:translateX(0)}46%,93%{opacity:0;transform:translateX(-40px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes sourcePage{0%,42%{opacity:0;transform:translateX(45px)}50%,92%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(45px)}}
      @keyframes searchActive{0%,40%{opacity:1}47%,93%{opacity:0}100%{opacity:1}}@keyframes sourceActive{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}@keyframes tabMarker{0%,40%{transform:translateX(0);width:160px}50%,92%{transform:translateX(178px);width:186px}100%{transform:translateX(0);width:160px}}
      @keyframes typed{0%,4%{clip-path:inset(0 100% 0 0)}21%,100%{clip-path:inset(0 0 0 0)}}@keyframes caret{50%{opacity:0}}
      @keyframes resultCard{0%,18%{opacity:0;transform:translateY(18px) scale(.96)}27%,43%{opacity:1;transform:translateY(0) scale(1)}48%,100%{opacity:0}}
      @keyframes trace{0%,12%{opacity:.22}22%,43%{opacity:1}48%,100%{opacity:.22}}
      @keyframes pointer{0%,56%{opacity:0;transform:translate(55px,50px)}60%{opacity:1;transform:translate(0,0)}64%{opacity:1;transform:translate(0,0) scale(.82)}68%,100%{opacity:0;transform:translate(0,0)}}
      @keyframes ring{0%{opacity:.65;transform:scale(.65)}90%,100%{opacity:0;transform:scale(1.7)}}
      @keyframes step1{0%,50%{opacity:.28}57%,100%{opacity:1}}@keyframes step2{0%,58%{opacity:.28}65%,100%{opacity:1}}@keyframes step3{0%,66%{opacity:.28}73%,100%{opacity:1}}@keyframes step4{0%,74%{opacity:.28}81%,100%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-28}}@keyframes candidate{0%,56%{opacity:.36;transform:translateY(10px) scale(.985)}68%,75%{opacity:.52;transform:translateY(5px) scale(.99)}83%,94%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:.36;transform:translateY(10px) scale(.985)}}
      @keyframes spark{0%,100%{transform:scale(.82) rotate(0);opacity:.65}50%{transform:scale(1.14) rotate(12deg);opacity:1}}
      @media (prefers-reduced-motion:reduce){.search-page,.source-page,.search-active,.source-active,.tab-marker,.typed,.caret,.result-card,.trace,.pointer,.ring,.step,.dash,.candidate,.spark{animation:none!important}.search-page,.search-active{opacity:0}.source-page,.source-active,.step,.candidate{opacity:1}.source-page{transform:none}.pointer{display:none}.tab-marker{transform:translateX(178px);width:186px}}
    </style>
  </defs>

  <rect width="1600" height="820" rx="40" fill="url(#background)"/><circle cx="130" cy="700" r="190" fill="#efbe9b" opacity=".35"/><circle cx="1470" cy="105" r="190" fill="#cadbc7" opacity=".55"/>
  <g filter="url(#shadow)"><rect x="56" y="50" width="1488" height="718" rx="32" fill="#fffdf9"/><rect x="56" y="50" width="1488" height="76" rx="32" fill="url(#nav)"/><path d="M56 95v31h1488V95" fill="url(#nav)"/></g>

  <g class="sans">
    <circle cx="100" cy="88" r="22" fill="#fff"/><path d="M100 70l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#e85d22" class="spark"/>
    <text x="137" y="95" class="label white">SEND FROM CHINA</text><rect x="319" y="70" width="112" height="36" rx="18" fill="#294f50"/><circle cx="340" cy="88" r="6" fill="#8fc080"/><text x="354" y="93" class="small white">Agent Core</text>
    <text x="1260" y="94" class="small white">Read-only runtime</text><rect x="1393" y="70" width="116" height="36" rx="18" fill="#fff" opacity=".12"/><text x="1414" y="94" class="small white">v1.0.0</text>

    <rect x="89" y="145" width="1430" height="56" rx="18" fill="#f3f2ec" stroke="#d7ded8"/>
    <rect x="109" y="155" width="160" height="36" rx="12" fill="#fff" class="search-active"/><rect x="287" y="155" width="186" height="36" rx="12" fill="#fff" class="source-active"/>
    <text x="137" y="179" class="label ink">Catalog Search</text><text x="316" y="179" class="label ink">Dynamic Sourcing</text><rect x="109" y="195" width="160" height="3" rx="1.5" fill="#e85d22" class="tab-marker"/>
    <rect x="1187" y="156" width="306" height="34" rx="17" fill="#e5ece5"/><circle cx="1208" cy="173" r="6" fill="#75a269"/><text x="1222" y="178" class="small ink">Tenant scoped · no browser credential</text>

    <g class="search-page">
      <text x="92" y="246" class="eyebrow orange">🔎 01 · GOVERNED DISCOVERY</text><text x="92" y="286" class="serif ink" font-size="37">Search the published catalog first.</text>
      <rect x="92" y="310" width="892" height="62" rx="22" fill="#f5f3ed" stroke="#cbd6cf"/><circle cx="124" cy="341" r="11" fill="none" stroke="#244c4e" stroke-width="3"/><path d="M132 349l11 11" stroke="#244c4e" stroke-width="3" stroke-linecap="round"/>
      <g class="typed"><text x="162" y="348" class="label ink">compact desk organizer under $40</text></g><rect x="465" y="328" width="2" height="26" fill="#e85d22" class="caret"/><rect x="878" y="320" width="92" height="42" rx="21" fill="#173f40"/><text x="902" y="347" class="small white">Search</text>
      <g class="result-card"><rect x="92" y="401" width="276" height="280" rx="22" fill="#f6f2e9" stroke="#d5ddd7"/><rect x="108" y="417" width="244" height="142" rx="16" fill="#e0e6dd"/><path d="M169 525h122v24H169zm18-74h86v78h-86z" fill="#8e765e"/><circle cx="230" cy="478" r="17" fill="#bdc9b7"/><text x="113" y="592" class="eyebrow green">CATALOG MATCH</text><text x="113" y="618" class="label ink">Modular desk organizer</text><text x="113" y="645" class="small muted">$29 · available band</text><rect x="113" y="657" width="152" height="8" rx="4" fill="#8dae80"/></g>
      <g class="result-card r2"><rect x="390" y="401" width="276" height="280" rx="22" fill="#f6f2e9" stroke="#d5ddd7"/><rect x="406" y="417" width="244" height="142" rx="16" fill="#efdfd2"/><path d="M467 531h122v18H467zm15-78h92v82h-92z" fill="#d5632b"/><path d="M501 470c0-27 54-27 54 0" fill="none" stroke="#9e401c" stroke-width="7"/><text x="411" y="592" class="eyebrow green">CATALOG MATCH</text><text x="411" y="618" class="label ink">Portable storage caddy</text><text x="411" y="645" class="small muted">$34 · available band</text><rect x="411" y="657" width="133" height="8" rx="4" fill="#8dae80"/></g>
      <g class="result-card r3"><rect x="688" y="401" width="296" height="280" rx="22" fill="#f6f2e9" stroke="#d5ddd7"/><rect x="704" y="417" width="264" height="142" rx="16" fill="#dfe9e5"/><path d="M772 526h128v23H772zm24-75h80v79h-80z" fill="#31595b"/><circle cx="836" cy="479" r="16" fill="#9bb6aa"/><text x="709" y="592" class="eyebrow green">CATALOG MATCH</text><text x="709" y="618" class="label ink">Stackable accessory tray</text><text x="709" y="645" class="small muted">$24 · low band</text><rect x="709" y="657" width="118" height="8" rx="4" fill="#8dae80"/></g>

      <rect x="1022" y="226" width="466" height="455" rx="24" fill="#10383b"/>
      <text x="1052" y="266" class="eyebrow" fill="#ff9a58">🧭 DECISION TRACE</text><text x="1052" y="302" class="serif white" font-size="29">Why these results?</text>
      <g class="trace"><circle cx="1071" cy="350" r="15" fill="#84b277"/><path d="M1064 350l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="1102" y="346" class="label white">Query parsed</text><text x="1102" y="368" class="small" fill="#a9c1bb">bounded terms · max 300 chars</text></g>
      <path d="M1071 370v47" stroke="#557577" stroke-width="2" class="dash"/>
      <g class="trace t2"><circle cx="1071" cy="433" r="15" fill="#84b277"/><path d="M1064 433l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="1102" y="429" class="label white">Criteria enforced</text><text x="1102" y="451" class="small" fill="#a9c1bb">price_max · tenant scope</text></g>
      <path d="M1071 453v47" stroke="#557577" stroke-width="2" class="dash"/>
      <g class="trace t3"><circle cx="1071" cy="516" r="15" fill="#84b277"/><path d="M1064 516l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="1102" y="512" class="label white">Public fields only</text><text x="1102" y="534" class="small" fill="#a9c1bb">no supplier or source records</text></g>
      <rect x="1052" y="575" width="406" height="72" rx="17" fill="#092d31" stroke="#426466"/><circle cx="1080" cy="611" r="8" fill="#8fbd80"/><path d="M1076 611l3 3 6-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="1100" y="606" class="eyebrow" fill="#9db8b2">SEARCH COMPLETE</text><text x="1100" y="628" class="small white">3 tenant-visible catalog matches</text>
    </g>

    <g class="source-page">
      <text x="92" y="246" class="eyebrow orange">✦ 02 · EXPLICIT EXPANSION</text><text x="92" y="286" class="serif ink" font-size="37">Search beyond the catalog.</text>
      <rect x="92" y="312" width="574" height="175" rx="24" fill="#f6f2e9" stroke="#d4dcd5"/><text x="120" y="347" class="eyebrow muted">📋 CONFIRMED BRIEF</text><text x="120" y="382" class="strong ink">Custom recycled travel organizer</text>
      <rect x="120" y="406" width="126" height="35" rx="17.5" fill="#fff"/><text x="137" y="429" class="small ink">💵 Budget $40</text><rect x="258" y="406" width="98" height="35" rx="17.5" fill="#fff"/><text x="272" y="429" class="small ink">📍 Ship US</text><rect x="368" y="406" width="157" height="35" rx="17.5" fill="#fff"/><text x="382" y="429" class="small ink">♻ Recycled textile</text>
      <rect x="120" y="449" width="230" height="24" rx="12" fill="#e5ebe4"/><circle cx="137" cy="461" r="7" fill="#77a36c"/><path d="M133 461l3 3 5-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="151" y="466" class="small ink">Terminal catalog miss verified</text>
      <rect x="446" y="326" width="189" height="42" rx="21" fill="#e85d22"/><text x="470" y="353" class="small white">✦ Confirm preview</text>
      <g class="pointer"><circle cx="624" cy="360" r="22" fill="#f58a50" opacity=".25" class="ring"/><path d="M612 344l22 18-12 3 7 15-7 3-7-15-9 8z" fill="#173f40" stroke="#fff" stroke-width="2"/></g>

      <rect x="92" y="509" width="574" height="172" rx="24" fill="#10383b"/>
      <text x="120" y="544" class="eyebrow" fill="#ff9a58">⚙ SOURCING TASK</text><text x="120" y="573" class="small" fill="#afc5bf">Illustrative preview · one confirmed task</text>
      <path d="M155 622H594" stroke="#4e7070" stroke-width="3" class="dash"/>
      <g class="step"><circle cx="155" cy="622" r="18" fill="#82b176"/><text x="131" y="659" class="small white">Proof</text></g>
      <g class="step s2"><circle cx="300" cy="622" r="18" fill="#82b176"/><text x="269" y="659" class="small white">QUEUED</text></g>
      <g class="step s3"><circle cx="447" cy="622" r="18" fill="#f08a4e" filter="url(#glow)"/><text x="409" y="659" class="small white">SOURCING</text></g>
      <g class="step s4"><circle cx="594" cy="622" r="18" fill="#82b176"/><path d="M586 622l6 6 11-13" fill="none" stroke="#fff" stroke-width="3"/><text x="543" y="659" class="small white">RESULTS READY</text></g>

      <rect x="700" y="226" width="788" height="455" rx="24" fill="#edf1ea" stroke="#d0dad1"/>
      <text x="730" y="266" class="eyebrow green">🔎 ILLUSTRATIVE RESULTS</text><text x="730" y="302" class="serif ink" font-size="29">Prepared matches for review</text><rect x="1264" y="250" width="194" height="34" rx="17" fill="#fff"/><circle cx="1285" cy="267" r="6" fill="#c7cbc6"/><text x="1299" y="272" class="small muted">Not purchase-ready</text>
      <g class="candidate"><rect x="730" y="331" width="350" height="287" rx="21" fill="#fff" stroke="#d2dbd4"/><rect x="748" y="349" width="314" height="136" rx="15" fill="#dfE7df"/><path d="M814 452h182v20H814zm25-63h132v67H839z" fill="#7d916f"/><path d="M865 407c0-22 76-22 76 0" fill="none" stroke="#526a50" stroke-width="7"/><text x="752" y="515" class="eyebrow orange">✦ PREVIEW CANDIDATE</text><text x="752" y="543" class="label ink">Recycled modular pouch</text><text x="752" y="569" class="small muted">Indicative item price · $26</text><rect x="752" y="585" width="190" height="23" rx="11.5" fill="#f1e6dc"/><text x="770" y="601" class="small orange">NO PURCHASE URL</text></g>
      <g class="candidate ca2"><rect x="1100" y="331" width="358" height="287" rx="21" fill="#fff" stroke="#d2dbd4"/><rect x="1118" y="349" width="322" height="136" rx="15" fill="#e7dfd4"/><path d="M1184 454h190v18h-190zm31-69h128v73h-128z" fill="#b07c56"/><circle cx="1279" cy="421" r="18" fill="#d8b28d"/><text x="1122" y="515" class="eyebrow orange">✦ PREVIEW CANDIDATE</text><text x="1122" y="543" class="label ink">Fold-flat travel organizer</text><text x="1122" y="569" class="small muted">Indicative item price · $31</text><rect x="1122" y="585" width="190" height="23" rx="11.5" fill="#f1e6dc"/><text x="1140" y="601" class="small orange">NO PURCHASE URL</text></g>
      <rect x="730" y="635" width="728" height="29" rx="14.5" fill="#dde6dc"/><circle cx="750" cy="649.5" r="6" fill="#6e9d64"/><text x="765" y="654" class="small ink">No external provider call in the self-hosted reference · no cart, checkout, order or payment write</text>
    </g>

    <rect x="90" y="716" width="1428" height="32" rx="16" fill="#f0eee8"/><text x="112" y="738" class="small muted">CAPABILITIES</text><circle cx="235" cy="732" r="6" fill="#75a269"/><text x="248" y="738" class="small ink">Catalog search</text><circle cx="376" cy="732" r="6" fill="#e7864d"/><text x="389" y="738" class="small ink">Confirmed sourcing preview</text><circle cx="591" cy="732" r="6" fill="#c6cac5"/><text x="604" y="738" class="small muted">Shipping rates not included</text><text x="1308" y="738" class="small muted">HTTP + MCP</text>
  </g>
</svg>
