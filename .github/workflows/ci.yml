name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  search-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked root dependencies
        run: npm ci
      - name: Test Search Contract SDK
        run: |
          mkdir -p artifacts
          npm run sdk:test 2>&1 | tee artifacts/sdk-search-contract-tests.log
      - name: Check generated Search Contract types
        run: npm run types:check 2>&1 | tee artifacts/search-contract-types.log
      - name: Run public synthetic Eval v0 smoke
        run: npm run eval:smoke -- --output artifacts/eval-v0-smoke.json
      - name: Test private annotation agreement preflight contracts
        run: npm run eval:private-agreement:test
      - name: Test aggregate-only private prediction scorer contracts
        run: npm run eval:private-score:test
      - name: Test local synthetic agent contract scaffolds
        run: |
          npm run eval:agent-trajectory:test 2>&1 | tee artifacts/agent-trajectory-contract-tests.log
          npm run eval:adversarial:test 2>&1 | tee artifacts/adversarial-contract-tests.log
      - name: Test MCP client documentation and stdio lifecycle
        run: node --test scripts/mcp-client-docs.test.mjs scripts/mcp-stdio-bridge.test.mjs 2>&1 | tee artifacts/mcp-client-tests.log
      - name: Upload Search Contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-contract-verification
          path: artifacts/

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: governance-worker/package-lock.json
      - name: Install locked dependencies
        working-directory: governance-worker
        run: npm ci
      - name: Check and test Worker
        run: |
          mkdir -p artifacts
          cd governance-worker
          npm run verify 2>&1 | tee ../artifacts/worker-verify.log
      - name: Audit locked dependencies
        run: |
          cd governance-worker
          npm audit --audit-level=high 2>&1 | tee ../artifacts/npm-audit.log
      - name: Upload Worker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-verification
          path: artifacts/

  hosted-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            hosted-sandbox/package-lock.json
            governance-worker/package-lock.json
      - name: Install locked hosted sandbox package
        run: npm --prefix hosted-sandbox ci --ignore-scripts --no-audit --no-fund
      - name: Install locked Wrangler toolchain
        run: npm --prefix governance-worker ci
      - name: Test hosted Shopify read-only sandbox
        run: |
          mkdir -p artifacts
          npm --prefix hosted-sandbox run verify 2>&1 | tee artifacts/hosted-sandbox-verify.log
      - name: Build default and staging candidates without deploying
        run: |
          node governance-worker/node_modules/wrangler/bin/wrangler.js deploy --dry-run --env="" --config hosted-sandbox/wrangler.toml --outdir hosted-sandbox/.wrangler/hosted-dry-run 2>&1 | tee artifacts/hosted-sandbox-dry-run.log
          node governance-worker/node_modules/wrangler/bin/wrangler.js deploy --dry-run --env staging --config hosted-sandbox/wrangler.toml --outdir hosted-sandbox/.wrangler/hosted-staging-dry-run 2>&1 | tee artifacts/hosted-sandbox-staging-dry-run.log
      - name: Upload hosted sandbox evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-sandbox-verification
          path: artifacts/

  sandbox-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned browser QA tooling
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.59.1 axe-core@4.13.0
      - name: Install Firefox and WebKit runtimes
        run: node node_modules/playwright-core/cli.js install --with-deps firefox webkit
      - name: Run the synthetic sandbox real-click matrix
        env:
          SANDBOX_QA_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: |
          mkdir -p artifacts/sandbox-browser
          AGENT_CORE_SANDBOX_QA_ARTIFACT_ROOT="$PWD/artifacts/sandbox-browser" npm run qa:sandbox-browser
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-browser-verification
          path: artifacts/sandbox-browser/

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m py_compile etl-pipeline/scripts/*.py etl-pipeline/tests/*.py publisher/*.py publisher/tests/*.py
      - name: Test product validator
        run: |
          mkdir -p artifacts
          python etl-pipeline/scripts/validate_import.py --source etl-pipeline/samples/sample_product.json --output /tmp/products.json --report artifacts/validation-report.json
      - name: Test ETL pipeline
        run: python -m unittest discover -s etl-pipeline/tests -p 'test_*.py' -v 2>&1 | tee artifacts/etl-tests.log
      - name: Test snapshot publisher
        run: python -m unittest discover -s publisher/tests -p 'test_*.py' -v 2>&1 | tee artifacts/publisher-tests.log
      - name: Build and validate a published snapshot
        run: |
          export CATALOG_ID_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          python publisher/build_snapshot.py --source publisher/samples/catalog-input.sample.json --output /tmp/published-catalog.json --report artifacts/publisher-report.json --generated-at 2026-08-23T12:00:00Z
          node scripts/validate-snapshot.mjs /tmp/published-catalog.json
      - name: Upload Python evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-verification
          path: artifacts/

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Scan public repository
        run: |
          mkdir -p artifacts
          node scripts/check-doc-links.mjs 2>&1 | tee artifacts/documentation-links.log
          node scripts/scan-public.mjs . 2>&1 | tee artifacts/public-safety-scan.log
      - name: Upload safety evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-safety-scan
          path: artifacts/

  dependency-review:
    # GitHub's dependency-review API requires Advanced Security for private
    # repositories. Dependabot alerts and npm audit cover the private RC; this
    # job activates automatically when the repository is made public.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate SPDX 2.3 SBOMs
        run: |
          mkdir -p artifacts/sbom
          npm sbom --package-lock-only --sbom-format=spdx --sbom-type=application > artifacts/sbom/agent-core.spdx.json
          npm --prefix governance-worker sbom --package-lock-only --sbom-format=spdx --sbom-type=application > artifacts/sbom/governance-worker.spdx.json
          npm --prefix sdk sbom --sbom-format=spdx --sbom-type=library > artifacts/sbom/agent-sdk.spdx.json
      - name: Validate SPDX artifacts
        run: |
          node -e "const fs=require('node:fs'); for (const file of fs.readdirSync('artifacts/sbom')) { const document=JSON.parse(fs.readFileSync('artifacts/sbom/'+file,'utf8')); if (document.spdxVersion !== 'SPDX-2.3' || document.SPDXID !== 'SPDXRef-DOCUMENT' || !Array.isArray(document.packages) || document.packages.length === 0) throw new Error('Invalid SPDX document: '+file); }"
      - name: Upload SPDX SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spdx-sbom-${{ github.sha }}
          path: artifacts/sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 90
